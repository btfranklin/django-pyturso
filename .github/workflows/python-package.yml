name: Python package

on:
    workflow_call:
        inputs:
            release:
                description: Run validation on every supported platform
                type: boolean
                default: false
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    quality:
        name: Quality (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(inputs.release && '["ubuntu-24.04", "macos-15", "windows-2025"]' || '["ubuntu-24.04"]') }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
              with:
                  python-version: "3.14"
                  cache: true
                  cache-dependency-path: pdm.lock
            - run: pdm lock --check
            - run: pdm sync -G dev --clean
            - run: pdm run audit
            - name: Install documentation checker
              run: python scripts/install_perfect_doc.py "${{ runner.temp }}/perfect-doc"
            - run: pdm run check-full
            - name: Test Django regressions in a file
              env:
                  DJANGO_PYTURSO_TEST_DB: ${{ runner.temp }}
              run: pdm run test-django-regressions --ds=tests.settings.turso_file
            - name: Test MVCC in memory
              run: pdm run test-mvcc
            - name: Test MVCC in a file
              env:
                  DJANGO_PYTURSO_MVCC_DB: ${{ runner.temp }}/django-pyturso-mvcc.db
              run: pdm run test-mvcc
            - run: pdm run build
            - name: Verify tag artifacts
              if: github.ref_type == 'tag'
              shell: bash
              run: pdm run verify-release --expected-version "${GITHUB_REF_NAME#v}"
            - name: Verify branch artifacts
              if: github.ref_type != 'tag'
              run: pdm run package-test

    current-dependencies:
        name: Current runtime dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
              with:
                  python-version: "3.14"
                  cache: true
                  cache-dependency-path: pdm.lock
            - run: pdm lock --check
            - run: pdm sync -G dev --clean
            - run: pdm update --stable --update-eager Django pyturso sqlparse
            - run: pdm update -G dev --stable --update-eager django-stubs
            - run: pdm run audit
            - name: Install documentation checker
              run: python scripts/install_perfect_doc.py "${{ runner.temp }}/perfect-doc"
            - run: pdm run check-full
            - name: Test Django regressions in a file
              env:
                  DJANGO_PYTURSO_TEST_DB: ${{ runner.temp }}
              run: pdm run test-django-regressions --ds=tests.settings.turso_file
            - name: Test MVCC in memory
              run: pdm run test-mvcc
            - name: Test MVCC in a file
              env:
                  DJANGO_PYTURSO_MVCC_DB: ${{ runner.temp }}/django-pyturso-mvcc.db
              run: pdm run test-mvcc

    dependency-review:
        name: Runtime dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: Review runtime dependency changes
              uses: actions/dependency-review-action@v5
              with:
                  config-file: ./.github/dependency-review-config.yml
