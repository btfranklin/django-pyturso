name: Python package

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: pdm.lock
            - run: pdm lock --check
            - run: pdm sync -G dev --clean
            - run: pdm run check-full
            - name: Test Django regressions in a file
              env:
                  DJANGO_PYTURSO_TEST_DB: ${{ runner.temp }}
              run: pdm run test-django-regressions --ds=tests.settings.turso_file
            - name: Test MVCC in memory
              run: pdm run test-mvcc
            - name: Test MVCC in a file
              env:
                  DJANGO_PYTURSO_MVCC_DB: ${{ runner.temp }}/django-pyturso-mvcc.db
              run: pdm run test-mvcc
            - run: pdm run build
            - run: pdm run package-test

    current-dependencies:
        name: Current runtime dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: pdm.lock
            - run: pdm lock --check
            - run: pdm sync -G dev --clean
            - run: pdm update --stable --update-eager Django pyturso
            - run: pdm update -G dev --stable --update-eager django-stubs
            - run: pdm run check-full
            - name: Test Django regressions in a file
              env:
                  DJANGO_PYTURSO_TEST_DB: ${{ runner.temp }}
              run: pdm run test-django-regressions --ds=tests.settings.turso_file
            - name: Test MVCC in memory
              run: pdm run test-mvcc
            - name: Test MVCC in a file
              env:
                  DJANGO_PYTURSO_MVCC_DB: ${{ runner.temp }}/django-pyturso-mvcc.db
              run: pdm run test-mvcc

    dependency-review:
        name: Runtime dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: Review runtime dependency changes
              uses: actions/dependency-review-action@v5
              with:
                  config-file: ./.github/dependency-review-config.yml
