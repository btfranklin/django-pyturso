# Publish the built Python package to PyPI when a GitHub Release is published.
# For more information, see https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: release
        permissions:
            contents: read
            # Required for PyPI Trusted Publishing.
            id-token: write

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
            - run: pdm lock --check
            - run: pdm sync -G dev --clean
            - run: pdm run check-full
            - name: Build package
              run: pdm build
            - name: Verify release artifacts
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: pdm run verify-release --expected-version "${RELEASE_TAG#v}"
            - name: Publish package with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
