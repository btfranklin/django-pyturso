name: Verify Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    platform-verification:
        name: Platform (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: macos
                      os: macos-15
                    - label: linux
                      os: ubuntu-24.04
                    - label: windows
                      os: windows-2025
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: pdm.lock
            - run: pdm lock --check
            - run: pdm sync -G dev --clean
            - run: pdm run check-full
            - name: Test Django regressions in a file
              env:
                  DJANGO_PYTURSO_TEST_DB: ${{ runner.temp }}
              run: pdm run test-django-regressions --ds=tests.settings.turso_file
            - name: Test MVCC in memory
              run: pdm run test-mvcc
            - name: Test MVCC in a file
              env:
                  DJANGO_PYTURSO_MVCC_DB: ${{ runner.temp }}/django-pyturso-mvcc.db
              run: pdm run test-mvcc

    package-verification:
        needs: platform-verification
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: pdm.lock
            - run: pdm sync -G dev --clean
            - run: pdm run build
            - name: Verify tag artifacts
              if: github.ref_type == 'tag'
              run: pdm run verify-release --expected-version "${GITHUB_REF_NAME#v}"
            - name: Verify branch artifacts
              if: github.ref_type != 'tag'
              run: pdm run package-test
