name: Verify Release

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validation:
        uses: ./.github/workflows/python-package.yml
        with:
            release: true

    security:
        uses: ./.github/workflows/codeql.yml
        permissions:
            actions: read
            contents: read
            security-events: write
